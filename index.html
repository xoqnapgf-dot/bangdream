<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyGO!!!!! × Ave Mujica 资料库</title>
<meta name="description" content="MyGO!!!!! 与 Ave Mujica 角色人设、剧情与设定资料库的网页浏览器。">
<link rel="stylesheet" href="assets/style.css?v=20261003031319">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎸</text></svg>">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#4a7fb5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyGO×Mujica">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="打开目录" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/" title="回到首页">
    <span class="brand-mark">MyGO<em>!!!!!</em></span>
    <span class="brand-sep">×</span>
    <span class="brand-mark alt">Ave Mujica</span>
  </a>

  <div class="topbar-spacer"></div>

  <button class="icon-btn" id="themeBtn" aria-label="切换深浅色">
    <svg class="ico-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="ico-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">

  <!-- ───────── 侧栏：文件夹树 ───────── -->
  <aside class="sidebar" id="sidebar">
    <div class="search-wrap">
      <svg class="search-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input type="search" id="search" placeholder="搜索文件…" autocomplete="off" spellcheck="false">
      <button class="clear-btn" id="clearBtn" aria-label="清除" hidden>&times;</button>
    </div>

    <div class="tree-actions">
      <button id="expandAll" class="mini-btn">展开全部</button>
      <button id="collapseAll" class="mini-btn">收起全部</button>
    </div>

    <nav class="tree" id="tree" aria-label="文件目录"></nav>

    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>

  <div class="scrim" id="scrim"></div>

  <!-- ───────── 主区：内容 ───────── -->
  <main class="main" id="main">
    <div class="crumb" id="crumb"></div>
    <article class="content" id="content"></article>
  </main>

  <!-- ───────── 右侧：本文大纲 ───────── -->
  <aside class="toc" id="toc"></aside>

</div>

<!-- 右下角按需返回：正文有本页跳转或跨文件跳转时才出现，窄屏（右侧大纲隐藏时）可见 -->
<div class="fab-stack" id="fabStack">
  <button class="fab back-fab" id="backFab" type="button" aria-label="返回上一页" title="返回上一页" hidden>上一页</button>
  <button class="fab contents-fab" id="contentsFab" type="button" aria-label="返回本文目录" title="返回本文目录" hidden>目录</button>
</div>

<!-- 直接加载离线数据，兼容 file://、content:// 及浏览器的本地文件查看模式。 -->
<script src="assets/offline-data.js?v=20261003031319"></script>
<script src="assets/app.js?v=20261003031319"></script>
<script>
/* 添加到主屏幕后的离线缓存；file:// 等本地打开方式不支持，会自动跳过。 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
