name: Temporary Bilibili video metadata
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/video-meta-temp.yml']
permissions:
  contents: write
jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        bvid:
          - BV15S7G6uE85
          - BV18qaV6TEiX
          - BV19YaK6dEbg
          - BV1CYaA6FEPD
          - BV1Jy42187oc
          - BV1LPa56UEG5
          - BV1MTah6QECq
          - BV1N17p6XEAX
          - BV1V1Yj6pEnR
          - BV1Xiha6dEKR
          - BV1ZLeG6JEha
          - BV1amhB6rEdi
          - BV1bgacz7E4J
          - BV1cyYi6REXH
          - BV1gP411u7kS
          - BV1iyyrYFESJ
          - BV1nz421B7Yy
          - BV1tEYE6UEkS
          - BV1xtYC6UEwN
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q requests
      - name: Read one video
        env:
          BVID: ${{ matrix.bvid }}
        run: |
          mkdir -p /tmp/meta
          python - <<'PY'
          import json, os, pathlib, re, requests
          bvid=os.environ['BVID']; out={}; headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'}
          def save(d):
              pages=d.get('pages') or []
              out[bvid]={'aid':d['aid'],'cid':pages[0]['cid'] if pages else d.get('cid'),'cover':d['pic'].replace('http://','https://'),'title':d['title']}
          try:
              r=requests.get('https://api.bilibili.com/x/web-interface/view',params={'bvid':bvid},headers=headers,timeout=20)
              p=r.json()
              if r.status_code == 200 and p.get('code') == 0: save(p['data'])
              else: print('api',r.status_code,p.get('code'))
          except Exception as e: print('api',repr(e))
          if not out:
              try:
                  html=requests.get('https://www.bilibili.com/video/'+bvid+'/',headers=headers,timeout=20).text
                  m=re.search(r'window\.__INITIAL_STATE__=(.*?);\(function\(\)',html)
                  if m: save(json.loads(m.group(1))['videoData'])
                  else: print('page has no initial state',len(html))
              except Exception as e: print('page',repr(e))
          pathlib.Path('/tmp/meta/'+bvid+'.json').write_text(json.dumps(out,ensure_ascii=False),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.bvid }}
          path: /tmp/meta/*.json
  merge:
    needs: collect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0ed01-bangdream
      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: /tmp/meta
          merge-multiple: true
      - name: Merge metadata
        run: |
          python - <<'PY'
          import json, pathlib
          target=pathlib.Path('assets/video-meta.json')
          out=json.loads(target.read_text('utf-8')) if target.exists() else {}
          for p in pathlib.Path('/tmp/meta').glob('*.json'):
              out.update(json.loads(p.read_text('utf-8')))
          for x in out.values(): x['cover']=x['cover'].replace('http://','https://')
          target.write_text(json.dumps(out,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print('collected',len(out),'videos')
          PY
      - name: Return metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/video-meta.json
          git diff --cached --quiet && exit 0
          git commit -m '补全 B 站视频播放元数据'
          git push origin HEAD:arena/01a0ed01-bangdream
