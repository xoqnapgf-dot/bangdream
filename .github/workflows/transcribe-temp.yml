name: Temporary Bilibili transcription

on:
  push:
    branches: [arena/01a0ed01-bangdream]
    paths: [.github/workflows/transcribe-temp.yml]

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: pip install -q requests faster-whisper
      - name: Download audio
        run: |
          mkdir -p /tmp/audio transcript
          cat > /tmp/download.py <<'PY'
          import requests
          from pathlib import Path
          S = requests.Session()
          S.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
          for bvid in 'BV18qaV6TEiX BV1MTah6QECq BV1LPa56UEG5 BV1N17p6XEAX'.split():
              meta = S.get('https://api-bilibili-com.translate.goog/x/web-interface/view', params={'bvid':bvid,'_x_tr_sl':'zh-CN','_x_tr_tl':'en','_x_tr_hl':'en'}, timeout=30).json()['data']
              cid = meta['cid']
              play = S.get('https://api-bilibili-com.translate.goog/x/player/playurl', params={'bvid':bvid,'cid':cid,'fnval':16,'qn':32,'_x_tr_sl':'zh-CN','_x_tr_tl':'en','_x_tr_hl':'en'}, timeout=30).json()['data']
              audio = max(play['dash']['audio'], key=lambda x:x.get('bandwidth',0))
              urls = [audio['baseUrl'], *audio.get('backupUrl', [])]
              for url in urls:
                  try:
                      r=S.get(url, timeout=120); r.raise_for_status()
                      Path(f'/tmp/audio/{bvid}.m4a').write_bytes(r.content)
                      print(bvid, cid, len(r.content)); break
                  except Exception as e: print('retry', bvid, type(e).__name__, e)
              else: raise RuntimeError(f'failed to download {bvid}')
          PY
          python /tmp/download.py
      - name: Transcribe Chinese speech
        run: |
          cat > /tmp/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          from pathlib import Path
          model = WhisperModel("small", device="cpu", compute_type="int8")
          for src in sorted(Path('/tmp/audio').iterdir()):
              segments, info = model.transcribe(str(src), language="zh", beam_size=5, vad_filter=True)
              out = Path('transcript') / f'{src.stem}.txt'
              with out.open('w', encoding='utf-8') as f:
                  f.write(f'# language={info.language} probability={info.language_probability:.4f}\n')
                  for s in segments:
                      f.write(f'[{s.start:07.2f} --> {s.end:07.2f}] {s.text.strip()}\n')
          PY
          python /tmp/transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-transcripts
          path: transcript/
          retention-days: 1
