name: Temporary story transcription
on:
  push:
    branches: [arena/01a0ed01-bangdream]
    paths: [.github/workflows/transcribe-temp.yml]
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests faster-whisper 'av<15'
      - name: Download story audio
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p /tmp/audio transcript
          rm -f transcript/BV19YaK6dEbg*.txt
          cat > /tmp/download.py <<'PY'
          import requests
          from pathlib import Path
          bvid='BV19YaK6dEbg'
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0','Referer':'https://www.bilibili.com/'})
          tr={'_x_tr_sl':'zh-CN','_x_tr_tl':'en','_x_tr_hl':'en'}
          meta=s.get('https://api-bilibili-com.translate.goog/x/web-interface/view',params={'bvid':bvid,**tr},timeout=30).json()['data']
          play=s.get('https://api-bilibili-com.translate.goog/x/player/playurl',params={'bvid':bvid,'cid':meta['cid'],'fnval':16,'qn':32,**tr},timeout=30).json()['data']
          audio=max(play['dash']['audio'],key=lambda x:x.get('bandwidth',0))
          for url in [audio['baseUrl'],*audio.get('backupUrl',[])]:
            try:
              r=s.get(url,timeout=180);r.raise_for_status();Path('/tmp/audio/story.m4a').write_bytes(r.content);break
            except Exception as e: print(e)
          else: raise RuntimeError('audio download failed')
          PY
          python /tmp/download.py
          ffmpeg -hide_banner -loglevel error -y -i /tmp/audio/story.m4a -ar 16000 -ac 1 /tmp/audio/story.wav
      - name: Transcribe Japanese story
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          cat > /tmp/transcribe.py <<'PY'
          import traceback
          from faster_whisper import WhisperModel
          try:
            m=WhisperModel('small',device='cpu',compute_type='int8')
            segs,info=m.transcribe('/tmp/audio/story.wav',language='ja',beam_size=5,vad_filter=True)
            with open('transcript/BV19YaK6dEbg.txt','w',encoding='utf-8') as f:
              for s in segs:f.write(f'[{s.start:07.2f} --> {s.end:07.2f}] {s.text.strip()}\n')
          except Exception:
            with open('transcript/BV19YaK6dEbg-error.txt','w',encoding='utf-8') as f:
              f.write(traceback.format_exc())
          PY
          python /tmp/transcribe.py
      - name: Return transcript
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transcript/
          git commit -m '临时保存 Ave Mujica 剧情转写'
          git push
