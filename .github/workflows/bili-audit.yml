name: Temporary Bilibili audit download
on:
  push:
    paths:
      - .github/workflows/bili-audit.yml
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f20c-bangdream
      - name: Download review copy
        run: |
          python -m pip install -q requests
          python - <<'PY'
          import json, requests
          api='https://r.jina.ai/http://api.bilibili.com/x/player/playurl?bvid=BV19oLBzQE2n%26cid=29648617472%26qn=16%26fnver=0%26fnval=1%26platform=html5'
          text=requests.get(api,timeout=60).text
          payload=next(line for line in text.splitlines() if line.startswith('{"code"'))
          url=json.loads(payload)['data']['durl'][0]['url']
          r=requests.get(url,headers={'Referer':'https://www.bilibili.com/video/BV19oLBzQE2n/','User-Agent':'Mozilla/5.0'},timeout=180)
          r.raise_for_status()
          open('audit-video.mp4','wb').write(r.content)
          print('downloaded',len(r.content))
          PY
      - name: Push temporary review copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-video.mp4
          git commit -m 'chore: add temporary audit video'
          git push origin HEAD:arena/01a0f20c-bangdream
