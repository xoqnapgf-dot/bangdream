name: Temporary Bilibili audit download
on:
  push:
    paths:
      - .github/workflows/bili-audit.yml
  workflow_dispatch:
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download review copy
        run: |
          python -m pip install -q yt-dlp
          yt-dlp --verbose --no-playlist -f 'best[ext=mp4]/best' -o avem13.mp4 'https://www.bilibili.com/video/BV19oLBzQE2n/' > yt.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: avem13-review
          path: |
            avem13.mp4
            yt.log
          if-no-files-found: warn
          retention-days: 1
