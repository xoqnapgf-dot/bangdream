name: Temporary Bilibili audit download
on:
  push:
    paths:
      - .github/workflows/bili-audit.yml
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/01a0f20c-bangdream
      - name: Download review copy
        run: |
          python -m pip install -q requests
          python - <<'PY'
          import requests
          url='https://upos-sz-mirrorcosov.bilivideo.com/upgcxcode/72/74/29648617472/29648617472-1-16.mp4?e=ig8euxZM2rNcNbRVhwdVhwdlhWdVhwdVhoNvNC8BqJIzNbfq9rVEuxTEnE8L5F6VnEsSTx0vkX8fqJeYTj_lta53NCM=&mid=0&deadline=1790808021&nbs=1&uipk=5&oi=572711363&os=cosovbv&og=hw&platform=html5&trid=e86655d14e2042b6b5fb0d5bc0ddfa6h&gen=playurlv3&upsig=7ccf8255ecd3c989cfbe905fcdefce51&uparams=e,mid,deadline,nbs,uipk,oi,os,og,platform,trid,gen&bvc=vod&nettype=0&bw=173876&lrs=0&agrr=1&buvid=&build=0&dl=0&f=h_0_0&orderid=0,1'
          r=requests.get(url,headers={'Referer':'https://www.bilibili.com/video/BV19oLBzQE2n/','User-Agent':'Mozilla/5.0'},timeout=180)
          r.raise_for_status()
          open('audit-video.mp4','wb').write(r.content)
          print('downloaded',len(r.content))
          PY
      - name: Push temporary review copy
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit-video.mp4
          git commit -m 'chore: add temporary audit video'
          git push origin HEAD:arena/01a0f20c-bangdream
